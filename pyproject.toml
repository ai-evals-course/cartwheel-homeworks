[project]
name = "cartwheel"
version = "0.1.0"
description = "Course repository for the Cartwheel support agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.2",
    "litellm>=1.70",
    "langfuse>=3.0,<4",
    "opentelemetry-instrumentation-openai-agents==0.62.3",
    "opentelemetry-sdk>=1.30",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "docetl>=0.2",
    "rapidfuzz>=3.14.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.optional-dependencies]
optimization = [
    "gepa>=0.1.4,<0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "observability", "scenarios", "seed", "server", "analysis", "replay", "optimize"]

[tool.pytest.ini_options]
testpaths = ["tests"]

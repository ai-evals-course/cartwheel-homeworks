<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cartwheel live chat console</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --border: #e2e0da; --text: #2b2a27;
    --muted: #8a877e; --user: #dbe9ff; --assistant: #eef1e8; --tool: #fff3d6;
    --accent: #4a6b3a; --accent-text: #ffffff; --danger: #b3452c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); display: flex; height: 100vh; }

  #sidebar { width: 320px; border-right: 1px solid var(--border); background: var(--panel);
    display: flex; flex-direction: column; }
  #sidebar h1 { font-size: 15px; margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  #newBtn { margin: 12px 16px 4px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-text); font-size: 13px; cursor: pointer; }
  #newBtn:hover { opacity: 0.9; }
  #search { margin: 8px 16px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; }
  #scenarioList { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  .scenario-row { padding: 8px 8px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
  .scenario-row:hover { background: #f0efe9; }
  .scenario-row.active { background: #e3e9dc; }
  .scenario-row .sid { font-weight: 600; }
  .scenario-row .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #statusbar { padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
    font-size: 12.5px; color: var(--muted); display: flex; gap: 16px; align-items: center; }
  #statusbar .badge { background: #eee; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  #statusbar .badge.live { background: #d9ecff; color: #1a5fa8; }

  #transcript { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
  #empty { margin: auto; color: var(--muted); font-size: 14px; text-align: center; max-width: 360px; }

  .divider { text-align: center; color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.04em; margin: 10px 0 2px; }
  .divider.live-divider { color: #1a5fa8; }

  .msg { max-width: 70%; padding: 9px 13px; border-radius: 10px; font-size: 13.5px; line-height: 1.45;
    white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.assistant { align-self: flex-start; background: var(--assistant); }
  .msg.tool { align-self: flex-start; background: var(--tool); font-family: ui-monospace, monospace;
    font-size: 12px; max-width: 85%; border: 1px solid #ecdca0; }
  .msg.tool .label { font-weight: 600; font-family: -apple-system, sans-serif; font-size: 11px;
    margin-bottom: 3px; color: #7a5c00; }
  .msg.recorded { opacity: 0.72; }
  .msg.live { box-shadow: 0 0 0 2px #bcdcff inset; }

  #composer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 20px;
    display: flex; gap: 10px; }
  #composer textarea { flex: 1; resize: none; padding: 9px 11px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 13.5px; font-family: inherit; height: 42px; }
  #composer button { padding: 0 18px; border-radius: 8px; border: none; background: var(--accent);
    color: var(--accent-text); font-size: 13.5px; cursor: pointer; }
  #composer button:disabled { background: #ccc; cursor: not-allowed; }

  #modalOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.25); display: none;
    align-items: center; justify-content: center; }
  #modalOverlay.open { display: flex; }
  #modal { background: var(--panel); border-radius: 10px; padding: 22px; width: 320px; }
  #modal h2 { margin: 0 0 14px; font-size: 15px; }
  #modal label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  #modal select, #modal input { width: 100%; padding: 6px 8px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px; }
  #modal .row { display: flex; gap: 10px; margin-top: 18px; }
  #modal button { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--border);
    background: #f2f2ef; cursor: pointer; font-size: 13px; }
  #modal button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
</style>
</head>
<body>

<div id="sidebar">
  <h1>Cartwheel live chat console</h1>
  <button id="newBtn">+ New session</button>
  <input id="search" placeholder="Search scenario id / intent...">
  <div id="scenarioList"></div>
</div>

<div id="main">
  <div id="statusbar">
    <span id="statusText">No session open — pick a scenario to resume, or start a new one.</span>
    <button id="exportBtn" style="display:none; margin-left:auto; padding:4px 10px; border-radius:6px; border:1px solid var(--accent); background:transparent; color:var(--accent); cursor:pointer; font-size:12px;">Export to review UI</button>
  </div>
  <div id="transcript"><div id="empty">Select a scenario on the left to resume its recorded conversation,<br>or click "+ New session" to start from scratch.</div></div>
  <div id="composer">
    <textarea id="input" placeholder="Type a follow-up message..." disabled></textarea>
    <button id="sendBtn" disabled>Send</button>
  </div>
</div>

<div id="modalOverlay">
  <div id="modal">
    <h2>Start a new session</h2>
    <label>Role</label>
    <select id="newRole">
      <option value="shopper">shopper</option>
      <option value="merchant">merchant</option>
      <option value="support">support</option>
    </select>
    <label>User id (optional — defaults per role)</label>
    <input id="newUserId" type="number" placeholder="e.g. 1">
    <div class="row">
      <button id="modalCancel">Cancel</button>
      <button id="modalStart" class="primary">Start</button>
    </div>
  </div>
</div>

<script>
const state = { scenarios: [], liveId: null, role: null, userId: null, resumedFrom: null };

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || res.statusText);
  }
  return res.json();
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderScenarioList(filter) {
  const list = document.getElementById('scenarioList');
  list.innerHTML = '';
  const f = (filter || '').toLowerCase();
  for (const s of state.scenarios) {
    const hay = `${s.id} ${s.intent} ${s.role}`.toLowerCase();
    if (f && !hay.includes(f)) continue;
    const row = el('div', 'scenario-row' + (s.id === state.resumedFrom ? ' active' : ''));
    row.appendChild(el('div', 'sid', s.id));
    row.appendChild(el('div', 'meta', `${s.role} · ${s.intent} · ${s.turn_count} turn(s)`));
    row.onclick = () => resumeScenario(s.id);
    list.appendChild(row);
  }
}

function renderMessage(m, live) {
  if (m.role === 'user' || m.role === 'assistant') {
    const bubble = el('div', `msg ${m.role} ${live ? 'live' : 'recorded'}`, m.text);
    return bubble;
  }
  if (m.role === 'tool_call') {
    const box = el('div', `msg tool ${live ? 'live' : 'recorded'}`);
    box.appendChild(el('div', 'label', `→ call: ${m.name}`));
    box.appendChild(document.createTextNode(JSON.stringify(m.arguments, null, 2)));
    return box;
  }
  if (m.role === 'tool_result') {
    const box = el('div', `msg tool ${live ? 'live' : 'recorded'}`);
    box.appendChild(el('div', 'label', `← result: ${m.name || ''}`));
    box.appendChild(document.createTextNode(JSON.stringify(m.content, null, 2)));
    return box;
  }
  return el('div', 'msg', JSON.stringify(m));
}

function appendTurn(messages, live) {
  const transcript = document.getElementById('transcript');
  const empty = document.getElementById('empty');
  if (empty) empty.remove();
  for (const m of messages) {
    transcript.appendChild(renderMessage(m, live));
  }
  transcript.scrollTop = transcript.scrollHeight;
}

function renderHistory(history) {
  const transcript = document.getElementById('transcript');
  transcript.innerHTML = '';
  if (!history.length) {
    transcript.appendChild(el('div', 'divider', 'new session — no recorded history'));
    return;
  }
  transcript.appendChild(el('div', 'divider', 'recorded conversation'));
  for (const m of history) transcript.appendChild(renderMessage(m, false));
  transcript.appendChild(el('div', 'divider live-divider', 'live from here'));
}

function setStatus() {
  const text = state.liveId
    ? `${state.resumedFrom ? 'Resumed ' + state.resumedFrom : 'New session'} — role: ${state.role}, user_id: ${state.userId}`
    : 'No session open — pick a scenario to resume, or start a new one.';
  document.getElementById('statusText').textContent = text;
  document.getElementById('input').disabled = !state.liveId;
  document.getElementById('sendBtn').disabled = !state.liveId;
  document.getElementById('exportBtn').style.display = state.liveId ? 'inline-block' : 'none';
}

async function exportSession() {
  try {
    const data = await api(`/api/live/${state.liveId}/export`, { method: 'POST' });
    alert(`Exported as trace_id ${data.trace_id}.\nSamples file now has ${data.total_samples} entries — refresh the review UI to see it in the sidebar.`);
  } catch (e) {
    alert('Export failed: ' + e.message);
  }
}
document.getElementById('exportBtn').onclick = exportSession;

async function resumeScenario(id) {
  try {
    const data = await api('/api/live/start', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ scenario_id: id }),
    });
    state.liveId = data.live_id;
    state.role = data.role;
    state.userId = data.user_id;
    state.resumedFrom = data.resumed_from;
    renderHistory(data.history);
    renderScenarioList(document.getElementById('search').value);
    setStatus();
  } catch (e) {
    alert('Could not resume: ' + e.message);
  }
}

async function startNew(role, userId) {
  try {
    const body = { role };
    if (userId) body.user_id = Number(userId);
    const data = await api('/api/live/start', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    state.liveId = data.live_id;
    state.role = data.role;
    state.userId = data.user_id;
    state.resumedFrom = null;
    renderHistory(data.history);
    renderScenarioList(document.getElementById('search').value);
    setStatus();
  } catch (e) {
    alert('Could not start session: ' + e.message);
  }
}

async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || !state.liveId) return;
  input.value = '';
  input.disabled = true;
  document.getElementById('sendBtn').disabled = true;
  try {
    const data = await api(`/api/live/${state.liveId}/message`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ message: text }),
    });
    appendTurn(data.turn, true);
  } catch (e) {
    alert('Message failed: ' + e.message);
  } finally {
    input.disabled = false;
    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }
}

document.getElementById('sendBtn').onclick = sendMessage;
document.getElementById('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('search').addEventListener('input', (e) => renderScenarioList(e.target.value));

document.getElementById('newBtn').onclick = () => document.getElementById('modalOverlay').classList.add('open');
document.getElementById('modalCancel').onclick = () => document.getElementById('modalOverlay').classList.remove('open');
document.getElementById('modalStart').onclick = () => {
  document.getElementById('modalOverlay').classList.remove('open');
  startNew(document.getElementById('newRole').value, document.getElementById('newUserId').value);
};

(async function boot() {
  const data = await api('/api/scenarios');
  state.scenarios = data.scenarios;
  renderScenarioList('');
  setStatus();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cartwheel · Trace review</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div><h1>Cartwheel <span>/ Trace review</span></h1><p id="source">Connecting to your trace collection…</p></div>
    <nav aria-label="Review views">
      <button data-view="read" aria-pressed="true">Review</button>
      <button data-view="labels" aria-pressed="false">Label</button>
      <button data-view="taxonomy" aria-pressed="false">Taxonomy</button>
      <button data-view="progress" aria-pressed="false">Progress</button>
    </nav>
    <div id="save-status" role="status" aria-live="polite">Loading…</div>
  </header>
  <div id="notice" role="alert" hidden></div>
  <main>
    <aside class="queue" aria-label="Conversation queue">
      <div class="queue-head"><h2>Conversations</h2><span id="queue-count"></span></div>
      <div id="queue-list"></div>
    </aside>
    <section class="workspace" aria-label="Review workspace">
      <div id="session-header"></div>
      <div id="view-scroll" tabindex="0" aria-label="Conversation content">
        <div id="read-view" class="view"><p class="empty">Loading conversations…</p></div>
        <div id="labels-view" class="view" hidden></div>
        <div id="taxonomy-view" class="view" hidden></div>
        <div id="progress-view" class="view" hidden></div>
      </div>
    </section>
  </main>
  <section id="note-popover" role="dialog" aria-modal="false" aria-labelledby="note-title" hidden>
    <form id="note-form">
      <blockquote id="note-quote"></blockquote>
      <label id="note-title" for="note-text" class="sr-only">Evidence note</label>
      <textarea id="note-text" rows="3" placeholder="Describe what went wrong, in your own words" required maxlength="20000"></textarea>
      <p class="note-hint">Enter saves · Shift+Enter new line · Esc cancels</p>
    </form>
  </section>
</body>
</html>

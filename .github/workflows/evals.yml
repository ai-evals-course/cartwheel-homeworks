name: evals

on:
  push:
  pull_request:

jobs:
  offline-checks:
    name: offline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Run checks that do not call a model
        run: uv run pytest tests/eval tests/test_cli.py tests/test_db.py tests/test_hw_holes.py tests/test_harbor_adapter.py tests/test_replay_harness.py -q

  complete-evaluations:
    name: Harbor evaluations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CARTWHEEL_MODEL: ${{ vars.CARTWHEEL_MODEL }}
      PYTHONPATH: ${{ github.workspace }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      # NOTE ON THIS JOB IN THIS FORK
      #
      # This job is complete and is what a fully provisioned environment runs. It is
      # not exercised on GitHub Actions here, for two reasons that are not about
      # Harbor:
      #
      #   1. CARTWHEEL_MODEL is served by an internal gateway that a GitHub-hosted
      #      runner cannot reach.
      #   2. OPENAI_API_KEY for that gateway is an internal credential, and sending it
      #      to a third-party CI provider is against policy.
      #
      # The offline-checks job above needs no credentials and does run here. The
      # equivalent of this job runs locally through scripts/run_ci_local.py, which
      # feeds Harbor-shaped results to the same harbor_adapter.summary.summarize_job
      # and therefore the same tests/eval/passk decision.
      # See analysis/report/hw6-ci-substitution.md.

      - name: Install Harbor
        run: uv tool install 'harbor==0.23.0'

      - name: Generate the classified Harbor tasks
        # Rejects any case still missing kind / baseline_pass_rate.
        run: uv run python scripts/export_harbor_tasks.py

      - name: Run five attempts per task in fresh Docker containers
        run: |
          PYTHONPATH="$PWD" harbor run \
            -p .harbor/tasks \
            -a harbor_adapter.agent:CartwheelAgent \
            -m "$CARTWHEEL_MODEL" \
            -e docker \
            --n-attempts 5 \
            --job-name hw6-evals \
            --jobs-dir .harbor/jobs \
            --yes

      - name: Summarize the job and apply the CI gate
        # always() so an intentional regression still reports its evidence. The script
        # exits non-zero when a regression case fails any of its five runs.
        if: always()
        run: |
          uv run python scripts/summarize_harbor_job.py \
            .harbor/jobs/hw6-evals \
            --expected-attempts 5

      - name: Upload the Harbor job files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw6-evals-job
          path: .harbor/jobs/hw6-evals
          if-no-files-found: warn
